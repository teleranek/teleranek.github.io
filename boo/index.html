<!DOCTYPE html>
<html>
    <head>
        <script type="text/javascript" src="deps/jquery.js" ></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="./deps/jszip.min.js"></script>
        <script type="module" src="./index.js"></script>
        <style>
            html,
            body {
            margin: 0;
            height: 100%;
            }

            #title {
                font-family: Verdana;
                font-size: 20px;
                padding: 10px;
            }

            @keyframes spin {
                from {
                    transform: rotate(0deg);
                }

                to {
                    transform: rotate(360deg);
                }
            }

            #site {
                display: flex;
                width: 100%;
                height: 100vh;
            }

            #main {
                flex: 3;              /* takes remaining space */
                padding: 20px;
            }

            #right {
                display: flex;
                flex-direction: column;
                flex: 1;
                padding: 20px;
            }

            #items {
                /* flex: 1;              takes remaining space */
                overflow-y: auto;     /* scroll if content overflows */
            }

            #nav {
                margin-top: 20px;
            }

            #file {
                margin-bottom: 20px;
            }
            
            .book-item {
                font-family: Verdana;
                font-size: 10px;
                background: #ddd;
                margin-bottom: 4px;
                padding: 2px;
                cursor: pointer;
            }
            .book-item:hover {
                background: #fff;
            }

            /* sloppy loader*/
            .loader {
                border: 4px solid #f3f3f3; /* Light grey */
                border-top: 4px solid #3498db; /* Blue */
                border-radius: 50%;
                width: 30px;
                height: 30px;
                animation: spin 1s linear infinite;
                margin: auto;
            }

            #header {
                height: 50px;
                font-family: Arial, Helvetica, sans-serif;
                font-size: 12px;
                padding: 10px;
                color: #666;
            }
        </style>
    </head>
    <body>
        <div id="header">
            Word usage in book analyzer, based on paper:
            "Ousiometrics: The essence of meaning aligns with a power-danger-structure framework instead of valence-arousal-dominance", https://www.science.org/doi/10.1126/sciadv.adr4039
        </div>
        <div id="title"></div>
        <div id="site">
            <div id="main">
                
            </div>
            <div id="right">
                <div id="file">
                    <label for="fileInput">Select epub or text file:</label>
                    <input type="file" id="fileInput" />
                </div>
                <div id="items"></div>
                <div id="nav"></div>
            </div>
        </div>
    </body>
</html>
